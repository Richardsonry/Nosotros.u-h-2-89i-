<title>Qué tanto sabes de nosotros</title>
<style>
  :root {
    --ink: #2b2325;
    --muted: #8a7a7f;
    --accent: #c2485c;
    --ok: #2f9e6a;
    --bad: #d0505a;
    --glass: rgba(255,255,255,.42);
    --glass-strong: rgba(255,255,255,.62);
    --edge: rgba(255,255,255,.75);
    --glass-shadow: 0 10px 30px rgba(150,60,90,.14), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: #fbe3ea; }
  body {
    min-height: 100vh; min-height: 100dvh;
    color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 16px;
    background: linear-gradient(160deg, #fff1f4 0%, #fde0e8 45%, #f6d5e6 100%) fixed;
    overflow-x: hidden;
  }
  /* Fondo con luces difusas para que el cristal tenga qué refractar */
  body::before {
    content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 30% at 15% 12%, rgba(255,150,170,.75), transparent 70%),
      radial-gradient(34% 28% at 90% 30%, rgba(190,160,255,.6), transparent 70%),
      radial-gradient(40% 32% at 20% 85%, rgba(255,190,150,.65), transparent 70%),
      radial-gradient(30% 26% at 85% 92%, rgba(255,120,160,.55), transparent 70%);
    filter: blur(20px);
  }
  button, a { touch-action: manipulation; }

  .app {
    width: 100%; max-width: 640px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }

  header { text-align: center; max-height: 220px; overflow: hidden; transition: opacity .6s ease, max-height .6s ease; }
  header.is-hidden { opacity: 0; max-height: 0; }
  h1 { font-weight: 700; font-size: clamp(1.4rem, 6.4vw, 2.4rem); letter-spacing: -.02em; line-height: 1.15; text-align: left; }
  .rule { display: none; }
  header { margin-bottom: 24px; }

  main { flex: 1; display: flex; flex-direction: column; }
  .screen {
    width: 100%; text-align: center; align-self: flex-start;
    opacity: 1; transform: translateY(0);
    transition: opacity .45s ease, transform .45s ease;
    animation: fadeIn .7s ease backwards;
  }
  .screen.center { align-self: center; margin: auto 0; }
  .screen.out { opacity: 0; transform: translateY(14px); }
  .screen.pre { opacity: 0; transform: translateY(-14px); transition: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- Cristal ---------- */
  .glass, .choice, .opt, .btn.wide, .question, .bar, .sub, .bye, .intro-title, .score-card, footer span {
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
  }
  .sub, .bye, .intro-title, .question, .score-card {
    background: var(--glass); border: 1px solid var(--edge);
    border-radius: 28px; box-shadow: var(--glass-shadow);
  }

  .sub { color: var(--muted); font-size: 1rem; line-height: 1.7; margin-bottom: 22px; padding: 22px 20px; }
  .sub em { color: var(--ink); font-family: var(--serif); font-size: 1.25rem; font-style: italic; }

  /* Botón principal: píldora negra de cristal, como "View upcoming sessions" */
  .btn {
    display: inline-block; font: inherit; font-weight: 600; font-size: .95rem; letter-spacing: 0;
    background: rgba(25,18,22,.9); color: #fff; border: 1px solid rgba(255,255,255,.18);
    padding: 16px 30px; border-radius: 999px; cursor: pointer; text-decoration: none;
    box-shadow: 0 8px 22px rgba(40,10,25,.28), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .2s, filter .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn.wide {
    display: block; width: 100%; font-size: 1rem; line-height: 1.35; border-radius: 22px; padding: 18px 20px;
    background: linear-gradient(180deg, rgba(214,84,110,.92), rgba(190,60,90,.92));
    box-shadow: 0 10px 26px rgba(190,60,90,.35), inset 0 1.5px 0 rgba(255,255,255,.45);
  }
  .again { margin-top: 22px; font-size: .85rem; }
  .again a { color: var(--muted); }

  .intro-title { font-weight: 700; font-size: clamp(1.5rem, 6.8vw, 2.1rem); line-height: 1.2; letter-spacing: -.02em; margin-bottom: 20px; padding: 30px 22px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pair.stack { grid-template-columns: 1fr; }
  .choice {
    font: inherit; font-weight: 600; font-size: 1.05rem; color: var(--ink);
    background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--glass-shadow);

let test = [], idx = 0, correct = 0, locked = false, answers = [];

function showStart() {
  screen.innerHTML = `

function startTest() {
  if (!READY.length) {
    go(() => { screen.innerHTML = `<p class="sub">Aún no hay preguntas listas.</p>`; }, { center: true });
    return;
  }
  let pool = READY.filter(q => !seen.has(q));
  if (pool.length < Math.min(PER_TEST, READY.length)) { seen.clear(); pool = READY; }
  test = shuffle(pool).slice(0, Math.min(PER_TEST, READY.length));
  test.forEach(q => seen.add(q));
  idx = 0; correct = 0; answers = [];
  go(showQuestion);
}

function showQuestion() {
  locked = false;
  const q = test[idx];
  const right = q.options[q.answer];
  const opts = shuffle(q.options.filter(o => o.trim()));
  screen.innerHTML = `
    <div class="meta">Pregunta ${idx + 1} de ${test.length}</div>
    <div class="bar"><i style="width:${(idx / test.length) * 100}%"></i></div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${opts.map((o, i) => `<button class="opt" data-v="${o.replace(/"/g, '&quot;')}"><b>${letters[i]}</b><span>${o}</span></button>`).join('')}
    </div>`;
  requestAnimationFrame(() => { screen.querySelector('.bar i').style.width = ((idx + 1) / test.length * 100) + '%'; });

  const buttons = [...screen.querySelectorAll('.opt')];
  const pick = btn => {
    if (locked) return;
    locked = true;
    const ok = btn.dataset.v === right;
    if (ok) correct++;
    answers.push({ q: q.text, chosen: btn.dataset.v, right, ok });
    buttons.forEach(b => {
      b.disabled = true;
      if (b.dataset.v === right) b.classList.add('ok');
      else if (b === btn) b.classList.add('bad');
      else b.classList.add('dim');
    });
    setTimeout(() => { idx++; idx < test.length ? go(showQuestion) : go(showResult, { center: true }); }, 1100);
  };
  buttons.forEach(b => b.onclick = () => pick(b));
  screen._keys = e => {
    const i = letters.indexOf(e.key.toUpperCase());
    if (i > -1 && buttons[i]) pick(buttons[i]);
  };
}

function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); rows.push(r); r = []; c = ''; }
    else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); rows.push(r); }
  return rows;
}

// Columnas: A fecha (opcional, AAAA-MM-DD) · B pregunta · C-F opciones · G correcta (A-D o 1-4)
function pickDaily(rows) {
  const clean = v => String(v || '').replace(/[<>]/g, '').trim();
  const p2 = n => String(n).padStart(2, '0');
  const iso = v => {
    v = clean(v);
    let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
    m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? `${m[3]}-${p2(m[2])}-${p2(m[1])}` : '';
  };
  const list = rows
    .map(r => ({ date: iso(r[0]), text: clean(r[1]), options: [2, 3, 4, 5].map(i => clean(r[i])), ans: clean(r[6]) }))
    .filter(r => r.text && r.text.toLowerCase() !== 'pregunta' && r.options.filter(Boolean).length >= 2);
  if (!list.length) return null;
  const d = new Date(), today = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  const dated = list.filter(r => r.date);
  const row = dated.length
    ? (dated.find(r => r.date === today) || dated.filter(r => r.date <= today).sort((a, b) => a.date < b.date ? -1 : 1).pop())
    : list[list.length - 1];
  if (!row) return null;
  const a = row.ans.toUpperCase();
  const idx = /^[A-D]$/.test(a) ? 'ABCD'.indexOf(a) : parseInt(a, 10) - 1;
  if (!(idx >= 0 && idx < 4) || !row.options[idx]) return null;
  return { text: row.text, options: row.options, answer: idx };
}

/* Lee una pestaña: primero por el Apps Script (SCRIPT_URL, al instante) y, si no, por el CSV publicado. Devuelve filas o null. */
async function fetchTab(tab, csvUrl) {
  const get = async url => {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    try { return await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), { signal: ctl.signal, cache: 'no-store' }); }
    finally { clearTimeout(to); }
  };
  if (API_URL) {
    try {
      const res = await get(API_URL + (API_URL.includes('?') ? '&' : '?') + 'hoja=' + tab);
      const j = await res.json();
      if (j && j.ok && Array.isArray(j.rows)) return j.rows;
    } catch (e) { /* se intenta con el CSV */ }
  }
  if (csvUrl) {
    try { const res = await get(csvUrl); if (res.ok) return parseCSV(await res.text()); } catch (e) {}
  }
  return null;
}

const readPhoto = f => new Promise(res => {
  const fr = new FileReader();
  fr.onerror = () => res(null);
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => res(null);
    im.onload = () => {
      const k = Math.min(1, 720 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .72));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
});

/* ===================== Perfil: redes sociales con QR ===================== */
const NETS = {
  instagram: { c: '#e1306c', l: 'IG', u: v => 'https://instagram.com/' + v },
  tiktok:    { c: '#111111', l: 'TT', u: v => 'https://www.tiktok.com/@' + v },
  snapchat:  { c: '#fffc00', ink: '#111', l: 'SC', u: v => 'https://www.snapchat.com/add/' + v },
  facebook:  { c: '#1877f2', l: 'f', u: v => 'https://www.facebook.com/' + v },
  x:         { c: '#111111', l: 'X', u: v => 'https://x.com/' + v },
  whatsapp:  { c: '#25d366', l: 'WA', u: v => 'https://wa.me/' + v.replace(/\D/g, '') },
  youtube:   { c: '#ff0033', l: 'YT', u: v => 'https://youtube.com/@' + v },
  telegram:  { c: '#229ed9', l: 'TG', u: v => 'https://t.me/' + v },
  spotify:   { c: '#1db954', l: '♪' },
};
const netKey = r => { const k = String(r || '').toLowerCase().replace(/[^a-z]/g, ''); return k === 'twitter' ? 'x' : k; };
const netInfo = r => NETS[netKey(r)] || { c: '#c2485c', l: (String(r || '?')[0] || '?').toUpperCase() };
function netUrl(red, v) {
  v = String(v || '').trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  const n = NETS[netKey(red)], u = v.replace(/^@/, '');
  if (n && n.u) return n.u(netKey(red) === 'whatsapp' ? u : encodeURIComponent(u));
  return /\./.test(v) && !/\s/.test(v) ? 'https://' + v : '';
}
const perfiles = () => (hasSheet(PERFIL_SHEET_URL) && store.get('qn_perfil', null)) || PERFILES;
async function loadPerfil() {
  if (!hasSheet(PERFIL_SHEET_URL)) return;

    const rows = await fetchTab('perfil', PERFIL_SHEET_URL);
    if (!rows) return;
    const map = new Map();
    rows.forEach(r => {
      const p = String(r[0] || '').trim(), red = String(r[1] || '').trim(), en = String(r[2] || '').trim();
      if (!p || !red || !en || p.toLowerCase() === 'persona') return;
      if (!map.has(p)) map.set(p, []);
      map.get(p).push({ red, enlace: en });
    });
    const list = [...map].map(([nombre, redes]) => ({ nombre, redes }));
    if (!list.length) return;

}

/* ===================== Pendientes ===================== */
const todoOps = () => store.get('qn_todo_ops', []);
function todos() {
  const m = new Map();
  store.get('qn_todo_srv', []).forEach(x => m.set(x.id, { ...x }));
  todoOps().forEach(o => {
    if (o.k === 'add') { if (!m.has(o.id)) m.set(o.id, { id: o.id, t: o.t, d: 0 }); }
    else if (o.k === 'done') { const x = m.get(o.id); if (x) x.d = o.d; }
    else if (o.k === 'del') m.delete(o.id);
  });
  return [...m.values()];
}
const todoLabel = () => { const l = todos(), n = l.filter(x => !x.d).length; return !l.length ? 'Sin tareas' : n ? `${n} por hacer` : 'Todo al día ✓'; };
const todoPost = o => o.k === 'add' ? { tipo: 'pendiente', id: o.id, texto: o.t } : o.k === 'done' ? { tipo: 'pendiente_hecho', id: o.id, hecho: !!o.d } : { tipo: 'pendiente_borrar', id: o.id };
function todoOp(o) {
  if (!API_URL) { // sin hoja: la lista guardada en este dispositivo es la lista
    let l = store.get('qn_todo_srv', []);
    if (o.k === 'add') l.push({ id: o.id, t: o.t, d: 0 });
    else if (o.k === 'done') l.forEach(x => { if (x.id === o.id) x.d = o.d; });
    else l = l.filter(x => x.id !== o.id);
    store.set('qn_todo_srv', l); return;
  }
  o.ts = Date.now();
  let ops = todoOps();
  if (o.k === 'done') ops = ops.filter(x => !(x.k === 'done' && x.id === o.id));
  if (o.k === 'del') ops = ops.filter(x => !(x.id === o.id && x.k === 'done'));
  store.set('qn_todo_ops', [...ops, o]);
  postApi(todoPost(o));
}
async function loadTodos() {
  if (!API_URL) return;
  try {
    const rows = await fetchTab('pendientes', '');
    if (!rows) return;
    const srv = rows.map(r => ({ id: String(r[0] || '').trim(), t: String(r[1] || '').trim(), d: /^(1|true|si|sí|x|✓|hecho)$/i.test(String(r[2] || '').trim()) ? 1 : 0 }))
      .filter(x => x.id && x.t && x.id.toLowerCase() !== 'id');
    store.set('qn_todo_srv', srv);
    const by = new Map(srv.map(x => [x.id, x])), now = Date.now();
    // los cambios que la hoja ya refleja (o tienen más de 30 min) se descartan; los demás se reenvían
    const ops = todoOps().filter(o => {
      if (now - o.ts > 30 * 60000) return false;
      if (o.k === 'add') return !by.has(o.id);
      if (o.k === 'done') { const x = by.get(o.id); return !!x && x.d !== o.d; }
      return by.has(o.id);
    });
    ops.forEach(o => { if (now - o.ts > 20000) postApi(todoPost(o)); });
    store.set('qn_todo_ops', ops);
    if ($('tdl')) renderTodoList();
    const n = $('pdn'); if (n) n.textContent = todoLabel();
  } catch (e) { /* sin internet: se queda con lo último guardado */ }
}
function renderTodoList() {
  const l = todos(), pend = l.filter(x => !x.d), done = l.filter(x => x.d);
  const row = x => `<div class="td${x.d ? ' done' : ''}"><button class="chk" data-id="${escH(x.id)}" aria-label="${x.d ? 'Marcar como pendiente' : 'Marcar como hecha'}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="tt">${escH(x.t)}</span><button class="xbtn" data-id="${escH(x.id)}" aria-label="Eliminar tarea">${TRASH}</button></div>`;
  $('tdl').innerHTML = `${pend.length ? pend.map(row).join('') : `<div class="evempty">${l.length ? '¡Todo al día! ♥' : 'No hay tareas pendientes.'}</div>`}
    ${done.length ? '<div class="evh">Hechas</div>' + done.map(row).join('') : ''}`;
}
function showTodos() {
  const back = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

}

/* ===================== Buzón ===================== */
// Carta del buzón ("Ábrelo cuando estés triste"). EDITA AQUÍ el texto: cada línea de "texto" es un párrafo.
const CARTA = {
  sobre: "Ábrelo cuando\nestés triste",
  saludo: "Mi amor,",
  texto: [
    "Si estás leyendo esto es porque hoy no ha sido un buen día, y lo primero que quiero decirte es que no estás sola.",
    "Respira profundo. Lo que sientes ahora es real, pero también es pasajero. Ya has superado días difíciles antes y siempre saliste más fuerte de lo que creías.",
    "Eres una persona increíble y tengo mucha suerte de tenerte. Aquí estoy para escucharte, abrazarte o simplemente quedarme a tu lado.",
    "Cuando quieras hablamos. O no hablamos y nos quedamos en silencio. Lo que necesites.",
  ],
  firma: "Con todo mi amor ♥",
};
// Notitas regadas a los lados (máximo 6). Las 4 primeras son más grandes; la 5 y la 6 deben ser cortas.
const NOTITAS = [
  "Eres mi lugar favorito ♥",
  "Todo va a estar bien, aquí estoy contigo",
  "Eres más fuerte de lo que crees",
  "Tu sonrisa es lo mejor de mis días",
  "Te quiero ♥",
  "Respira ♥",
];

// 🔗 BUZÓN DESDE GOOGLE SHEETS (opcional): pega aquí el link CSV de tu hoja publicada y podrás cambiar la carta y las
// notitas desde el celular (con un atajo o la app de Sheets) sin tocar este archivo. Vacío ("") = se usan CARTA y NOTITAS de arriba.
// La hoja tiene dos columnas: A = campo, B = valor. Campos: sobre, saludo, carta, firma, nota1 … nota6.
// En "carta" cada salto de línea dentro de la celda es un párrafo nuevo.
const BUZON_SHEET_URL = "";

function buzonFromRows(rows) {
  const out = {}, nn = {};
  rows.forEach(r => {
    const k = String(r[0] || '').trim().toLowerCase().replace(/\s+/g, ''), v = String(r[1] || '').trim();
    if (!k || !v) return;
    let m;
    if (k === 'sobre' || k === 'saludo' || k === 'firma') out[k] = v;
    else if (k === 'carta') out.texto = v.split(/\n+/).map(x => x.trim()).filter(Boolean);
    else if ((m = /^nota(\d)$/.exec(k))) nn[+m[1]] = v;
  });
  out.notas = Object.keys(nn).sort((a, b) => a - b).map(k => nn[k]).slice(0, 6);
  return out;
}
function getBuzon() {
  const b = (hasSheet(BUZON_SHEET_URL) && store.get('qn_buzon', null)) || {};
  return {
    sobre: b.sobre || CARTA.sobre, saludo: b.saludo || CARTA.saludo, firma: b.firma || CARTA.firma,
    texto: b.texto && b.texto.length ? b.texto : CARTA.texto,
    notas: b.notas && b.notas.length ? b.notas : NOTITAS,
  };
}
async function loadBuzon() {
  if (!hasSheet(BUZON_SHEET_URL)) return;
  try {
    const rows = await fetchTab('buzon', BUZON_SHEET_URL);
    if (!rows) return;
    const b = buzonFromRows(rows);
    if (!b.sobre && !b.saludo && !b.firma && !b.texto && !b.notas.length) return; // la hoja no es válida: se queda con lo guardado
    if (JSON.stringify(store.get('qn_buzon', null)) === JSON.stringify(b)) return;
    store.set('qn_buzon', b);
    const stg = $('stg');
    if (stg && !stg.classList.contains('opened')) showMailbox(true); // si está en el buzón sin abrir, se refresca
  } catch (e) { /* sin internet: se queda con la última carta guardada */ }
}

function showMailbox(noLoad) {
  const B = getBuzon();
  const back = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  const POS = [
    'left:0;top:1%;--r:-7deg', 'right:0;top:7%;--r:6deg', 'left:2%;bottom:4%;--r:5deg', 'right:1%;bottom:10%;--r:-5deg',
    'left:-2%;top:38%;--r:-6deg;width:23%', 'right:-2%;top:46%;--r:7deg;width:23%',
  ];
  const COL = ['#fff3a8', '#ffd3df', '#cdf0dc', '#e4d9fb', '#ffe0b8', '#d4e8ff'];
  const notes = B.notas.slice(0, 6).map((t, i) => `<div class="note" style="${POS[i]};--nb:${COL[i]}">${escH(t)}</div>`).join('');
  screen.innerHTML = `<div class="home">
    ${dateTop()}
    <div class="jtop" style="justify-content:flex-start;gap:12px"><button class="rbtn" id="back" aria-label="Volver">${back}</button><h2 class="big">Buzón</h2></div>
    <div class="stage" id="stg">
      ${notes}
      <div class="env" id="env" role="button" tabindex="0" aria-label="Abrir sobre">
        <div class="eback"></div><div class="slip"></div><div class="efront"></div><div class="ebot"></div>
        <div class="elabel">${escH(B.sobre)}</div>
        <div class="eflap"></div><div class="seal">♥</div>
      </div>
      <div class="hint" id="hint">Toca el sobre</div>
      <div class="paper" id="paper">
        <button class="pclose" id="pclose" aria-label="Cerrar carta">✕</button>
        <div class="pbody"><p class="psal">${escH(B.saludo)}</p>${B.texto.map(t => `<p>${escH(t)}</p>`).join('')}<p class="pfirm">${escH(B.firma)}</p></div>
      </div>
    </div>
  </div>`;
  screen.classList.remove('center'); screen.classList.add('full');
  $('back').onclick = goHome;
  const stg = $('stg'), env = $('env');
  const openIt = () => {
    if (stg.classList.contains('opened')) return;
    stg.classList.add('opened'); env.classList.add('open');
    setTimeout(() => stg.classList.add('read'), 1100);
  };
  env.onclick = openIt;
  env.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIt(); } };
  $('pclose').onclick = () => {
    stg.classList.remove('read');
    setTimeout(() => { env.classList.remove('open'); stg.classList.remove('opened'); }, 600);

/* ===================== Eventos ===================== */
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtTime = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return t || ''; const h = +m[1]; return `${h % 12 || 12}:${m[2]} ${h < 12 ? 'AM' : 'PM'}`; };
const evKey = e => e.date + '|' + String(e.title).trim().toLowerCase();
const isoOf = v => {
  v = String(v || '').trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[3]}-${pad2(m[2])}-${pad2(m[1])}` : '';
};
const dateLabel2 = iso => {
  const [y, m, d] = String(iso).split('-').map(Number); if (!y) return 'Elegir fecha';
  const x = new Date(y, m - 1, d).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '');
  return x[0].toUpperCase() + x.slice(1);
};
const allEvents = () => {
  const seen = new Set(), out = [], del = new Set(store.get('qn_ev_del', []).map(x => x.k));
  const add = (list, src) => list.forEach(e => {
    if (!e || !e.date || !e.title) return;
    const k = evKey(e); if (seen.has(k) || del.has(k)) return;
    seen.add(k); out.push({ ...e, src });
  });
  add(EVENTS, 'code');
  if (hasSheet(EVENTS_SHEET_URL)) add(store.get('qn_ev_sheet', []), 'sheet');
  add(store.get('qn_ev_local', []), 'local');
  return out.sort((a, b) => (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1);
};

async function loadEventos() {
  if (!hasSheet(EVENTS_SHEET_URL)) return;
  try {
    const rows = await fetchTab('eventos', EVENTS_SHEET_URL);
    if (!rows) return;
    const evs = rows.map(r => ({ date: isoOf(r[0]), time: String(r[1] || '').trim(), title: String(r[2] || '').trim(), note: String(r[3] || '').trim() }))
      .filter(e => e.date && e.title);
    store.set('qn_ev_sheet', evs);
    const keys = new Set(evs.map(evKey)), now = Date.now();
    // borrados pendientes: se quitan cuando ya no están en la hoja (o a los 30 min); si siguen, se reenvían
    const dels = store.get('qn_ev_del', []).filter(x => keys.has(x.k) && now - x.ts < 30 * 60000);
    dels.forEach(x => { if (now - x.ts > 20000) postApi({ tipo: 'evento_borrar', fecha: x.d, titulo: x.t }); });
    store.set('qn_ev_del', dels);
    // añadidos locales: se quitan cuando ya llegaron a la hoja (o al día); si no, se reenvían
    const loc = store.get('qn_ev_local', []).filter(e => !keys.has(evKey(e)) && now - (e.ts || 0) < 864e5);
    loc.forEach(e => { if (now - e.ts > 20000) postApi({ tipo: 'evento', fecha: e.date, hora: '', titulo: e.title, nota: '' }); });
    store.set('qn_ev_local', loc);
    if ($('evl')) renderEvList();
  } catch (e) { /* sin internet: se queda con lo último guardado */ }
}

function addEvent(title, date) {
  store.set('qn_ev_local', [...store.get('qn_ev_local', []), { date, time: '', title, note: '', ts: Date.now() }]);
  postApi({ tipo: 'evento', fecha: date, hora: '', titulo: title, nota: '' });
}
function deleteEvent(e) {
  const k = evKey(e);
  store.set('qn_ev_local', store.get('qn_ev_local', []).filter(x => evKey(x) !== k));
  store.set('qn_ev_del', [...store.get('qn_ev_del', []).filter(x => x.k !== k), { k, d: e.date, t: e.title, ts: Date.now() }]);
  postApi({ tipo: 'evento_borrar', fecha: e.date, titulo: e.title });
}
/* Botón de borrar en dos pasos: el primer toque pide confirmar ("¿Borrar?"), el segundo borra. */
function armDelete(btn, fn) {
  if (btn.classList.contains('arm')) { fn(); return; }
  btn.classList.add('arm'); btn.dataset.h = btn.innerHTML; btn.textContent = '¿Borrar?';
  setTimeout(() => { if (btn.isConnected && btn.classList.contains('arm')) { btn.classList.remove('arm'); btn.innerHTML = btn.dataset.h; } }, 3000);
}
const TRASH = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>';

const EV_PAL = [
  { c: "#c2275a", bg: "#ffe3ec" }, { c: "#1f6fd1", bg: "#e0eeff" }, { c: "#14825a", bg: "#dcf6ea" },
  { c: "#b36b00", bg: "#fff0d2" }, { c: "#7b3fc4", bg: "#efe6fb" },
];

let evShown = [];
function renderEvList() {
  const t = todayISO(), evs = allEvents();
  const up = evs.filter(e => e.date >= t), past = evs.filter(e => e.date < t).reverse();
  evShown = [...up, ...past]; evShown.forEach((e, i) => { e._i = i; });
  const card = (e, i, old) => {
    const [y, m, d] = e.date.split('-').map(Number), dt = new Date(y, m - 1, d), col = EV_PAL[i % EV_PAL.length];
    const wd = dt.toLocaleDateString('es-CO', { weekday: 'long' });
    return `<div class="ev${e.date === t ? ' today' : ''}${old ? ' old' : ''}" style="--c:${col.c};background:${col.bg}">
      <div class="evd"><b>${d}</b><span>${dt.toLocaleDateString('es-CO', { month: 'short' }).replace('.', '')}</span></div>
      <div class="evt"><div class="evn">${escH(e.title)}</div><div class="evs">${e.date === t ? '<em>Hoy</em> · ' : ''}${wd[0].toUpperCase() + wd.slice(1)}${e.time ? ' · ' + escH(fmtTime(e.time)) : ''}${e.note ? ' · ' + escH(e.note) : ''}</div></div>
      ${e.src === 'code' ? '' : `<button class="xbtn" data-i="${e._i}" aria-label="Eliminar evento">${TRASH}</button>`}</div>`;
  };
  $('evl').innerHTML = `${up.length ? up.map((e, i) => card(e, i, false)).join('') : '<div class="evempty">Aún no hay eventos programados.</div>'}
      ${past.length ? '<div class="evh">Anteriores</div>' + past.map((e, i) => card(e, i, true)).join('') : ''}`;
}

function showEvents() {
  const back = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  const cal = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  screen.innerHTML = `<div class="home" style="padding-bottom:20px">
    ${dateTop()}
    <div class="jtop" style="gap:12px"><button class="rbtn" id="back" aria-label="Volver">${back}</button><h2 class="big" style="flex:1">Eventos</h2></div>
    <div class="evadd">
      <input id="evt" type="text" maxlength="60" placeholder="Título del evento" enterkeyhint="done" autocomplete="off">
      <div class="rrow"><label class="datef"><span id="evdl">${dateLabel2(todayISO())}</span>${cal}<input id="evdt" type="date" value="${todayISO()}" aria-label="Fecha del evento"></label><button class="send" id="evgo" aria-label="Añadir evento"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="evmsg" id="evmsg">${API_URL ? '' : 'Por ahora se guarda solo en este dispositivo.'}</div>
    </div>
    <div class="evlist" id="evl"></div>
  </div>`;
  screen.classList.remove('center'); screen.classList.add('full');
  renderEvList();
  $('back').onclick = goHome;
  const dt = $('evdt');
  const syncLabel = () => { $('evdl').textContent = dateLabel2(dt.value); };
  dt.addEventListener('input', syncLabel); dt.addEventListener('change', syncLabel);
  dt.addEventListener('click', () => { try { if (dt.showPicker) dt.showPicker(); } catch (e) {} });
  const idle = () => (API_URL ? '' : 'Por ahora se guarda solo en este dispositivo.');
  const msg = t => { const m = $('evmsg'); if (!m) return; m.textContent = t; m.classList.add('show'); clearTimeout(msg.to); msg.to = setTimeout(() => { m.classList.remove('show'); m.textContent = idle(); }, 2600); };
  const add = () => {
    const ti = $('evt'), title = ti.value.trim().replace(/[<>]/g, ''), date = isoOf(dt.value);
    if (!title) { ti.focus(); return msg('Escribe el título del evento'); }
    if (!date) return msg('Elige la fecha');
    addEvent(title, date);
    ti.value = ''; ti.blur();
    renderEvList(); $('evl').scrollTop = 0;
    msg('Evento añadido ♥');
  };
  $('evgo').onclick = add;
  $('evt').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  $('evl').onclick = e => {
    const b = e.target.closest('.xbtn'); if (!b) return;
    armDelete(b, () => { const ev = evShown[+b.dataset.i]; if (ev) { deleteEvent(ev); renderEvList(); msg('Evento eliminado'); } });
  };
  loadEventos();
}

function showDaily() {
  const q = dailyQ();
  if (!q) {
    screen.innerHTML = `<p class="sub">Todavía no hay pregunta del día.</p><button class="btn" id="hm">Volver</button>`;
    $('hm').onclick = goHome; return;
  }
  const right = q.options[q.answer];
  const opts = q.options.filter(o => o.trim());
  screen.innerHTML = `
    <div class="meta">Pregunta del día</div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${opts.map((o, i) => `<button class="opt" data-v="${o.replace(/"/g, '&quot;')}"><b>${letters[i]}</b><span>${o}</span></button>`).join('')}
    </div>
    <div id="after"></div>`;
  const buttons = [...screen.querySelectorAll('.opt')];
  const reveal = chosen => {
    buttons.forEach(b => {
      b.disabled = true;
      if (b.dataset.v === right) b.classList.add('ok');
      else if (b.dataset.v === chosen) b.classList.add('bad');
      else b.classList.add('dim');
    });
    const ok = chosen === right;
    $('after').innerHTML = `
      <p class="detail" style="margin:16px 0 12px;text-align:center">${ok ? '¡Correcto! 💕' : 'Casi… la respuesta era ' + right}</p>
      <a class="btn wide" href="${waLink(`Pregunta del día 💕\n${q.text}\n→ ${chosen} ${ok ? '✅' : `❌ (era: ${right})`}`)}" target="_blank" rel="noopener">Enviar mi respuesta 💌</a>
      <button class="btn glass full" id="hm" style="margin-top:10px">Volver al inicio</button>`;
    $('hm').onclick = goHome;
  };
  const st = dailyState();
  if (st) reveal(st.chosen);
  else buttons.forEach(b => b.onclick = () => { store.set('qn_daily', { key: q.text, chosen: b.dataset.v }); reveal(b.dataset.v);
    logEvent({ tipo: 'Pregunta del día', pregunta: q.text, respuesta: b.dataset.v, acierto: b.dataset.v === right ? 'Sí' : 'No', respuesta_correcta: right }); });
}

/* Bloquea el movimiento vertical de la página (solo se mueve el carrusel, o el contenido si no cabe) */
document.addEventListener('touchmove', e => {
  if (e.target.closest('.pager')) return;
  const m = e.target.closest('main');
  if (m && !screen.classList.contains('full') && m.scrollHeight > m.clientHeight + 1) return;
  e.preventDefault();
}, { passive: false });

if (INTRO_ENABLED) {
  introAsk();
} else {
  renderHome();
}
loadDaily(); loadBuzon(); loadEventos(); loadPerfil(); loadTodos(); flushLog();
$('fallback').style.display = 'none';
</script>
