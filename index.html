<title>Qué tanto sabes de nosotros</title>
<style>
  :root {
    --ink: #2b2325;
    --muted: #8a7a7f;
    --accent: #c2485c;
    --ok: #2f9e6a;
    --bad: #d0505a;
    --glass: rgba(255,255,255,.42);
    --glass-strong: rgba(255,255,255,.62);
    --edge: rgba(255,255,255,.75);
    --glass-shadow: 0 10px 30px rgba(150,60,90,.14), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: #fbe3ea; }
  body {
    min-height: 100vh; min-height: 100dvh;
    color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 16px;
    background: linear-gradient(160deg, #fff1f4 0%, #fde0e8 45%, #f6d5e6 100%) fixed;
    overflow-x: hidden;
  }
  /* Fondo con luces difusas para que el cristal tenga qué refractar */
  body::before {
    content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:

/* ===================== Utilidades ===================== */
const $ = id => document.getElementById(id);
const screen = $('screen');
const head = $('head');
const letters = ['A', 'B', 'C', 'D'];
const seen = new Set();

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Solo cuentan las preguntas con al menos 2 opciones y respuesta válida
const READY = BANK.filter(q => q.options.filter(o => o.trim()).length >= 2 && (q.options[q.answer] || '').trim());
console.log(`Preguntas listas: ${READY.length} de ${BANK.length}`);

const waLink = text => {
  const n = String(WHATSAPP_NUMBER).replace(/\D/g, '');
  const base = n.length >= 8 ? `https://wa.me/${n}` : 'https://wa.me/';
  return `${base}?text=${encodeURIComponent(text)}`;
};

// Transición suave entre pantallas
let moving = false;
function go(renderFn, opts = {}) {
  if (moving) return;
  moving = true;
  $('dock').classList.remove('on');
  screen.classList.add('out');
  setTimeout(() => {
    screen._keys = null;
    renderFn();
    screen.classList.toggle('center', !!opts.center);
    head.classList.toggle('is-hidden', !!opts.hideTitle);
    screen.classList.remove('out');
    screen.classList.add('pre');
    void screen.offsetWidth;
    screen.classList.remove('pre');
    window.scrollTo(0, 0);
    moving = false;
  }, 450);
}

/* ===================== Test ===================== */
let test = [], idx = 0, correct = 0, locked = false, answers = [];

function showStart() {
  screen.innerHTML = `
    <p class="sub">${PER_TEST} preguntas sobre nosotros.<br>Responde con el corazón… y con memoria. ♥</p>
    <button class="btn" id="start">Empezar</button>`;
  $('start').onclick = startTest;
}

function startTest() {
  if (!READY.length) {
    go(() => { screen.innerHTML = `<p class="sub">Aún no hay preguntas listas.</p>`; }, { center: true });
    return;
  }
  let pool = READY.filter(q => !seen.has(q));
  if (pool.length < Math.min(PER_TEST, READY.length)) { seen.clear(); pool = READY; }
  test = shuffle(pool).slice(0, Math.min(PER_TEST, READY.length));
  test.forEach(q => seen.add(q));
  idx = 0; correct = 0; answers = [];
  go(showQuestion);
}

function showQuestion() {
  locked = false;
  const q = test[idx];
  const right = q.options[q.answer];
  const opts = shuffle(q.options.filter(o => o.trim()));
  screen.innerHTML = `
    <div class="meta">Pregunta ${idx + 1} de ${test.length}</div>
    <div class="bar"><i style="width:${(idx / test.length) * 100}%"></i></div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${opts.map((o, i) => `<button class="opt" data-v="${o.replace(/"/g, '&quot;')}"><b>${letters[i]}</b><span>${o}</span></button>`).join('')}
    </div>`;
  requestAnimationFrame(() => { screen.querySelector('.bar i').style.width = ((idx + 1) / test.length * 100) + '%'; });

  const buttons = [...screen.querySelectorAll('.opt')];
  const pick = btn => {
    if (locked) return;
    locked = true;
    const ok = btn.dataset.v === right;
    if (ok) correct++;
    answers.push({ q: q.text, chosen: btn.dataset.v, right, ok });
    buttons.forEach(b => {
      b.disabled = true;
      if (b.dataset.v === right) b.classList.add('ok');
      else if (b === btn) b.classList.add('bad');
      else b.classList.add('dim');
    });
    setTimeout(() => { idx++; idx < test.length ? go(showQuestion) : go(showResult, { center: true }); }, 1100);
  };
  buttons.forEach(b => b.onclick = () => pick(b));
  screen._keys = e => {
    const i = letters.indexOf(e.key.toUpperCase());
    if (i > -1 && buttons[i]) pick(buttons[i]);
  };
}

function resultLink(pct) {
  const lines = answers.map((a, i) =>
    `${i + 1}. ${a.q} → ${a.chosen} ${a.ok ? '✅' : `❌ (era: ${a.right})`}`);
  return waLink(`Resultado del test 💕\nPuntaje: ${pct}/100 (${correct} de ${test.length})\n\n${lines.join('\n')}`);
}

function showResult() {
  const pct = Math.round((correct / test.length) * 100);
  const m = MESSAGES.find(m => pct <= m.max);
  screen.innerHTML = `
    <div class="score-card">
      <div class="meta" style="text-align:center;padding:0">Tu puntaje</div>
      <div class="score">${pct}<small> / 100</small></div>
      <div class="msg">${m.text}</div>
      <p class="detail">${correct} de ${test.length} respuestas correctas · ${m.detail}</p>
    </div>
    <a class="btn wide" href="${resultLink(pct)}" target="_blank" rel="noopener">Enviar mi resultado 💌</a>
    <button class="btn" id="again" style="margin-top:16px">Intentar de nuevo</button><button class="btn glass" id="home" style="margin:16px 0 0 8px">Inicio</button>`;
  if ($('home')) $('home').onclick = goHome;
  $('again').onclick = startTest;
}

document.addEventListener('keydown', e => screen._keys && screen._keys(e));

/* ===================== Inicio + Pregunta del día ===================== */
const store = {
  get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const dayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const dayNum = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const dailyQ = () => READY.length ? READY[dayNum() % READY.length] : null;
const dailyState = () => { const s = store.get('qn_daily', null); return s && s.key === dayKey() ? s : null; };
const goHome = () => go(renderHome, { hideTitle: true });
const entry = goHome;

const readPhoto = f => new Promise(res => {
  const fr = new FileReader();
  fr.onerror = () => res(null);
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => res(null);
    im.onload = () => {
      const k = Math.min(1, 720 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .72));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
});

function renderHome() {
  const mine = store.get('qn_photos', []).map(p => typeof p === 'string' ? { s: p, d: 0 } : p);
  const items = [...PHOTOS.map(p => ({ s: p.src, d: 0 })), ...mine.map((p, i) => ({ ...p, mine: i }))];
  const cards = Math.floor(items.length / 5) + 1;
  const fmt = t => { const x = new Date(t || Date.now()).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }); return x[0].toUpperCase() + x.slice(1); };
  const plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const spark = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3 6.3 2.2-6.3 2.2L12 19l-2.2-6.3-6.3-2.2 6.3-2.2z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>';
  const done = dailyState();
  let list = '';
  const wd = new Date().getDay();
  const calHtml = `<div class="cal"><h4>🎓 Calendario Universidad</h4><div class="cgrid">${SCHEDULE.map(d => `<div class="day${d.dow === wd ? ' today' : ''}" style="--c:${d.color};background:${d.bg}"><div class="dn">${d.day}</div>${d.items.map(([t, n]) => `<div class="cls"><span>${t}</span><b>${n}</b></div>`).join('')}</div>`).join('')}</div></div>`;
  for (let c = 0; c < cards; c++) {
    const chunk = items.slice(c * 5, c * 5 + 5);
    const slots = [0, 1, 2, 3, 4].map(j => {
      const it = items[c * 5 + j];
      return it
        ? `<div class="slot"><img src="${it.s}" alt=""${it.mine !== undefined ? ` data-m="${it.mine}"` : ''}></div>`
        : `<button class="slot" data-add="1" aria-label="Añadir foto">${plus}</button>`;
    }).join('');
    list += `<div class="entry"><div class="mosaic">${slots}</div>
      <h4>${c === 0 ? 'Nuestros momentos' : 'Más momentos'}</h4>
      <p>${chunk.length ? 'Recuerdos de ustedes dos ♥' : 'Toca un recuadro para añadir una foto.'}</p>
      <div class="foot"><span>${fmt(chunk[0] && chunk[0].d)}</span><span>${chunk.length} de 5</span></div></div>`;
    if (c === 0) list += calHtml;
  }
  screen.innerHTML = `<div class="home">
    <div class="jtop"><h2 class="big">Nuestro diario</h2>
      <button class="rbtn${DAILY_ENABLED ? '' : ' off'}" id="dq" aria-label="Pregunta del día"${DAILY_ENABLED ? '' : ' disabled'}>${spark}${DAILY_ENABLED && !done ? '<i class="dot"></i>' : ''}</button></div>
    ${list}
    <input type="file" accept="image/*" multiple id="pf" style="display:none">
  </div>`;
  $('dock').classList.add('on');
  $('tq').onclick = startTest;
  if (DAILY_ENABLED) $('dq').onclick = () => go(showDaily);
  screen.querySelectorAll('[data-add]').forEach(b => b.onclick = () => $('pf').click());
  $('pf').onchange = async e => {
    const l = store.get('qn_photos', []);
    for (const f of e.target.files) { const src = await readPhoto(f); if (src) l.push({ s: src, d: Date.now() }); }
    if (!store.set('qn_photos', l)) alert('No hay espacio para guardar más fotos en este teléfono.');
    renderHome();
  };
  screen.querySelectorAll('img[data-m]').forEach(im => im.onclick = () => {
    if (!confirm('¿Quitar esta foto?')) return;
    const l = store.get('qn_photos', []); l.splice(+im.dataset.m, 1); store.set('qn_photos', l); renderHome();
  });
}

function showDaily() {
  const q = dailyQ();
  if (!q) {
    screen.innerHTML = `<p class="sub">Aún no hay preguntas listas.</p><button class="btn" id="hm">Volver</button>`;
    $('hm').onclick = goHome; return;
  }
  const right = q.options[q.answer];
  const opts = q.options.filter(o => o.trim());
  screen.innerHTML = `
    <div class="meta">Pregunta del día</div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${opts.map((o, i) => `<button class="opt" data-v="${o.replace(/"/g, '&quot;')}"><b>${letters[i]}</b><span>${o}</span></button>`).join('')}
    </div>
    <div id="after"></div>`;
  const buttons = [...screen.querySelectorAll('.opt')];
  const reveal = chosen => {
    buttons.forEach(b => {
      b.disabled = true;
      if (b.dataset.v === right) b.classList.add('ok');
      else if (b.dataset.v === chosen) b.classList.add('bad');
      else b.classList.add('dim');
    });
    const ok = chosen === right;
    $('after').innerHTML = `
      <p class="detail" style="margin:16px 0 12px;text-align:center">${ok ? '¡Correcto! 💕' : 'Casi… la respuesta era ' + right}</p>
      <a class="btn wide" href="${waLink(`Pregunta del día 💕\n${q.text}\n→ ${chosen} ${ok ? '✅' : `❌ (era: ${right})`}`)}" target="_blank" rel="noopener">Enviar mi respuesta 💌</a>
      <button class="btn glass full" id="hm" style="margin-top:10px">Volver al inicio</button>`;
    $('hm').onclick = goHome;
  };
  const st = dailyState();
  if (st) reveal(st.chosen);
  else buttons.forEach(b => b.onclick = () => { store.set('qn_daily', { key: dayKey(), chosen: b.dataset.v }); reveal(b.dataset.v); });
}

/* Bloquea el movimiento vertical de la página (solo se mueve el carrusel, o el contenido si no cabe) */
document.addEventListener('touchmove', e => {
  if (e.target.closest('.carousel')) return;
  const m = e.target.closest('main');
  if (m && m.scrollHeight > m.clientHeight + 1) return;
  e.preventDefault();
}, { passive: false });

if (INTRO_ENABLED) {

} else {

}
$('fallback').style.display = 'none';
