<style>
  :root {
    --ink: #2b2325;
    --muted: #8a7a7f;
    --accent: #c2485c;
    --ok: #2f9e6a;
    --bad: #d0505a;
    --glass: rgba(255,255,255,.42);
    --glass-strong: rgba(255,255,255,.62);
    --edge: rgba(255,255,255,.75);
    --glass-shadow: 0 10px 30px rgba(150,60,90,.14), inset 0 0 0 1px rgba(255,255,255,.95);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: #fbe3ea; }
  body {
    min-height: 100vh; min-height: 100dvh;
    color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 16px;
    background: linear-gradient(160deg, #fff1f4 0%, #fde0e8 45%, #f6d5e6 100%) fixed;
    overflow-x: hidden;
  }
  /* Fondo con luces difusas para que el cristal tenga qué refractar */
  body::before {
    content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 30% at 15% 12%, rgba(255,150,170,.75), transparent 70%),
      radial-gradient(34% 28% at 90% 30%, rgba(190,160,255,.6), transparent 70%),
      radial-gradient(40% 32% at 20% 85%, rgba(255,190,150,.65), transparent 70%),
      radial-gradient(30% 26% at 85% 92%, rgba(255,120,160,.55), transparent 70%);
    filter: blur(20px);
  }
  button, a { touch-action: manipulation; }

  .app {
    width: 100%; max-width: 640px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }

  header { text-align: center; max-height: 220px; overflow: hidden; transition: opacity .6s ease, max-height .6s ease; }
  header.is-hidden { opacity: 0; max-height: 0; }
  h1 { font-weight: 700; font-size: clamp(1.4rem, 6.4vw, 2.4rem); letter-spacing: -.02em; line-height: 1.15; text-align: left; }
  .rule { display: none; }
  header { margin-bottom: 24px; }

  main { flex: 1; display: flex; flex-direction: column; }
  .screen {
    width: 100%; text-align: center; align-self: flex-start;
    opacity: 1; transform: translateY(0);
    transition: opacity .45s ease, transform .45s ease;
    animation: fadeIn .7s ease backwards;
  }
  .screen.center { align-self: center; margin: auto 0; }
  .screen.out { opacity: 0; transform: translateY(14px); }
  .screen.pre { opacity: 0; transform: translateY(-14px); transition: none; }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---------- Cristal ---------- */
  .glass, .choice, .opt, .btn.wide, .question, .bar, .sub, .bye, .intro-title, .score-card, footer span {
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
  }
  .sub, .bye, .intro-title, .question, .score-card {
    background: var(--glass); border: 1px solid var(--edge);
    border-radius: 28px; box-shadow: var(--glass-shadow);
  }

  .sub { color: var(--muted); font-size: 1rem; line-height: 1.7; margin-bottom: 22px; padding: 22px 20px; }
  .sub em { color: var(--ink); font-family: var(--serif); font-size: 1.25rem; font-style: italic; }

  /* Botón principal: píldora negra de cristal, como "View upcoming sessions" */
  .btn {
    display: inline-block; font: inherit; font-weight: 600; font-size: .95rem; letter-spacing: 0;
    background: rgba(25,18,22,.9); color: #fff; border: 1px solid rgba(255,255,255,.18);
    padding: 16px 30px; border-radius: 999px; cursor: pointer; text-decoration: none;
    box-shadow: 0 8px 22px rgba(40,10,25,.28), inset 0 0 0 1px rgba(255,255,255,.25);
    transition: transform .2s, filter .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn.wide {
    display: block; width: 100%; font-size: 1rem; line-height: 1.35; border-radius: 22px; padding: 18px 20px;
    background: linear-gradient(180deg, rgba(214,84,110,.92), rgba(190,60,90,.92));
    box-shadow: 0 10px 26px rgba(190,60,90,.35), inset 0 0 0 1px rgba(255,255,255,.45);
  }
  .again { margin-top: 22px; font-size: .85rem; }
  .again a { color: var(--muted); }

  .intro-title { font-weight: 700; font-size: clamp(1.5rem, 6.8vw, 2.1rem); line-height: 1.2; letter-spacing: -.02em; margin-bottom: 20px; padding: 30px 22px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pair.stack { grid-template-columns: 1fr; }
  .choice {
    font: inherit; font-weight: 600; font-size: 1.05rem; color: var(--ink);

  /* ===== Pantalla fija tipo iPhone (19.5:9) ===== */

  #dock { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; isolation: isolate; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .35s, transform .35s; }

  /* ===== Sombras sin recortes ===== */

  /* El degradado de abajo coincidía mal con el fondo: ahora el fondo es liso abajo */

  .pnote { position: absolute; z-index: 2; width: 34%; max-width: 136px; padding: 12px 10px 12px; border-radius: 3px; background: var(--nb); color: #5b3b40; font-family: "Bradley Hand", "Segoe Print", "Segoe Script", "Marker Felt", "Comic Sans MS", cursive; font-size: .8rem; line-height: 1.25; text-align: center; transform: rotate(var(--r)); box-shadow: 0 6px 12px rgba(90,40,60,.16); }

  .pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 26px 16px 18px 44px; scrollbar-width: none; font-family: "Bradley Hand", "Segoe Print", "Segoe Script", "Marker Felt", "Comic Sans MS", cursive; font-size: .9rem; line-height: 24px; color: #4a3236; background: repeating-linear-gradient(transparent 0 23px, rgba(194,72,92,.14) 23px 24px) 0 12px local; }

  .cup { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; color: var(--ink); background: linear-gradient(135deg, var(--a), var(--b)); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(90,40,60,.1); }

  .ghud { display: flex; gap: 10px; margin: 6px 0 10px; }

  /* ===== Cabecera fija en páginas internas: el contenido pasa por debajo ===== */

  /* ===== Botón ¿Quieres ser millonario? (azul plateado con brillo) ===== */
  .tiles.p2 .tile.mill { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; min-height: 92px; padding: 14px 16px; overflow: hidden; color: #0f2a52;

  .mbal { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 6px; padding: 12px 16px; border-radius: 20px; color: #0f2a52; background: linear-gradient(120deg, #f4f8ff 0%, #d5e1f3 40%, #a9c1e6 100%); box-shadow: 0 4px 14px rgba(70,110,180,.22), inset 0 0 0 1px rgba(255,255,255,.8); }

  .mbal .ms { text-align: right; font-size: .74rem; font-weight: 700; opacity: .75; line-height: 1.35; }
  .mstage { position: relative; height: 170px; margin: 6px 0 0; user-select: none; -webkit-user-select: none; }
  .mshd { position: absolute; bottom: 14px; left: var(--x); width: 30%; aspect-ratio: 100 / 68; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 50% 27% at 50% 84%, rgba(10,24,86,.55) 0%, rgba(10,24,86,.42) 60%, rgba(10,24,86,0) 100%); filter: blur(2px); transition: left .32s ease, transform .45s cubic-bezier(.3,.8,.3,1), opacity .45s ease; }
  .mcup.up + .mshd { transform: scale(.8); opacity: .55; }

  .mcup.chosen svg { filter: drop-shadow(0 0 10px rgba(60,110,255,.85)); }
  @keyframes mbob { 50% { transform: translateY(-5px); } }
  .mstone { position: absolute; bottom: 24px; width: 22px; height: 16px; margin-left: -11px; border-radius: 50% 50% 46% 46%; background: radial-gradient(circle at 35% 30%, #d9dde3, #7b8493 70%); box-shadow: 0 3px 5px rgba(40,50,70,.4); opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .3s ease; z-index: 1; }

  .mbet { background: #fff; border-radius: 22px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(90,40,60,.08); }

  .mbet.off { opacity: .55; pointer-events: none; }
  .btn.mgo { background: linear-gradient(180deg, #4a78c4, #2a4f93); box-shadow: 0 5px 14px rgba(42,79,147,.35), inset 0 0 0 1px rgba(255,255,255,.4); margin-top: 12px; }

  .mrule { text-align: center; color: var(--muted); font-size: .76rem; line-height: 1.45; margin: 12px 8px 0; }

  /* ===== Perfil con inicio de sesión · Calendario fijo · Botón de notas ===== */

  /* ===== Cupones con QR (se canjean una sola vez) ===== */

/* =====================================================================
   LIQUID GLASS · estilo iOS 26
   ===================================================================== */
:root{--glass:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.66);--surface:rgba(255,255,255,.36);--surface-hi:rgba(255,255,255,.7);--field:rgba(140,70,95,.09);--edge:rgba(255,255,255,.72);--sheet:rgba(255,247,250,.84);
 --rim:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.5),inset -1px 0 0 rgba(255,255,255,.25);
 --drop:0 12px 30px -10px rgba(150,60,90,.3),0 2px 6px rgba(150,60,90,.08);
 --sheen:linear-gradient(155deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 42%,rgba(255,255,255,.24));
 --bar:76px;--tbink:rgba(56,38,46,.8);color-scheme:light}
html[data-theme=dark]{--ink:#f8eff3;--muted:#bba8b1;--accent:#ff7d97;--bg:#150f17;--glass:rgba(255,255,255,.1);--glass-strong:rgba(255,255,255,.18);--surface:rgba(255,255,255,.09);--surface-hi:rgba(255,255,255,.18);--field:rgba(255,255,255,.1);--edge:rgba(255,255,255,.2);--sheet:rgba(34,24,38,.88);
 --rim:inset 0 1.5px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.06),inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.05);
 --drop:0 16px 36px -12px rgba(0,0,0,.7);--sheen:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,0) 46%,rgba(255,255,255,.06));--tbink:rgba(255,255,255,.9);color-scheme:dark}
html,body{background:var(--bg)}
body{background:radial-gradient(70% 40% at 0% 0%,rgba(255,165,192,.6),transparent 70%),radial-gradient(60% 36% at 100% 14%,rgba(200,175,255,.5),transparent 70%),radial-gradient(70% 40% at 90% 100%,rgba(255,190,160,.5),transparent 70%),var(--bg)}
html[data-theme=dark] body{background:radial-gradient(70% 40% at 0% 0%,rgba(194,72,92,.42),transparent 70%),radial-gradient(60% 36% at 100% 15%,rgba(110,80,200,.4),transparent 70%),radial-gradient(70% 40% at 80% 100%,rgba(194,72,92,.3),transparent 70%),var(--bg)}
@media(min-width:600px){body,html[data-theme=dark] body{background:#e8e3e7}html[data-theme=dark] body{background:#0b080c}.app{background:var(--bg)!important}}

/* Superficies de cristal en todas partes */
.entry,.cal,.req,.td,.pcard,.ppick,.jrule,.wal div,.ghud div,.mbet,.garea,.evadd,.calbtn,.needlog .nli,.cjopt,.gcard,.tile:not(.main):not(.mill),.jwho button:not(.on),.rbtn,.avatar,.sess,.cup{
 background:var(--sheen),var(--surface)!important;border:1px solid var(--edge)!important;box-shadow:var(--rim),var(--drop)!important;
 -webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%)}
.sheet,.qbox,.qrbox{background:var(--sheen),var(--sheet)!important;border:1px solid var(--edge);box-shadow:var(--rim),0 30px 60px -12px rgba(40,10,25,.45)!important;-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%)}
.shh{background:transparent!important}
.shead.stuck{background:var(--sheen),var(--glass)}
.shead{-webkit-backdrop-filter:blur(26px) saturate(190%)}
.rrow input,.sinp,.evadd>input,.datef,.tact input,.slot,.mchips button,.td .xbtn{background:var(--field)!important;color:var(--ink)}

let test = [], idx = 0, correct = 0, locked = false, answers = [];

function showStart() {
  screen.innerHTML = `
    <p class="sub">${PER_TEST} preguntas sobre nosotros.<br>Responde con el corazón… y con memoria. ♥</p>
    <button class="btn" id="start">Empezar</button>`;
  $('start').onclick = startTest;
}

function startTest() {
  if (!READY.length) {
    go(() => { screen.innerHTML = `<p class="sub">Aún no hay preguntas listas.</p>`; }, { center: true });
    return;
  }
  let pool = READY.filter(q => !seen.has(q));
  if (pool.length < Math.min(PER_TEST, READY.length)) { seen.clear(); pool = READY; }
  test = shuffle(pool).slice(0, Math.min(PER_TEST, READY.length));
  test.forEach(q => seen.add(q));
  idx = 0; correct = 0; answers = [];
  go(showQuestion);
}

function showQuestion() {
  locked = false;
  const q = test[idx];
  const right = q.options[q.answer];
  const opts = shuffle(q.options.filter(o => o.trim()));
  screen.innerHTML = `
    <div class="meta">Pregunta ${idx + 1} de ${test.length}</div>
    <div class="bar"><i style="width:${(idx / test.length) * 100}%"></i></div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${opts.map((o, i) => `<button class="opt" data-v="${o.replace(/"/g, '&quot;')}"><b>${letters[i]}</b><span>${o}</span></button>`).join('')}
    </div>`;
  requestAnimationFrame(() => { screen.querySelector('.bar i').style.width = ((idx + 1) / test.length * 100) + '%'; });

  const buttons = [...screen.querySelectorAll('.opt')];
  const pick = btn => {
    if (locked) return;
    locked = true;
    const ok = btn.dataset.v === right;
    if (ok) correct++;
    answers.push({ q: q.text, chosen: btn.dataset.v, right, ok });
    buttons.forEach(b => {
      b.disabled = true;
      if (b.dataset.v === right) b.classList.add('ok');
      else if (b === btn) b.classList.add('bad');
      else b.classList.add('dim');
    });
    setTimeout(() => { idx++; idx < test.length ? go(showQuestion) : go(showResult, { center: true }); }, 1100);
  };
  buttons.forEach(b => b.onclick = () => pick(b));
  screen._keys = e => {
    const i = letters.indexOf(e.key.toUpperCase());
    if (i > -1 && buttons[i]) pick(buttons[i]);
  };
}

function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); rows.push(r); r = []; c = ''; }
    else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); rows.push(r); }
  return rows;
}

/* Lee una pestaña: primero por el Apps Script (SCRIPT_URL, al instante) y, si no, por el CSV publicado. Devuelve filas o null. */
async function fetchTab(tab, csvUrl) {
  const get = async url => {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    try { return await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), { signal: ctl.signal, cache: 'no-store' }); }
    finally { clearTimeout(to); }
  };
  if (API_URL) {
    try {
      const res = await get(API_URL + (API_URL.includes('?') ? '&' : '?') + 'hoja=' + tab);
      const j = await res.json();
      if (j && j.ok && Array.isArray(j.rows)) return j.rows;
    } catch (e) { /* se intenta con el CSV */ }
  }
  if (csvUrl) {
    try { const res = await get(csvUrl); if (res.ok) return parseCSV(await res.text()); } catch (e) {}
  }
  return null;
}
/* Pide al Apps Script cualquier cosa por GET y devuelve el JSON (o null). */
async function apiGet(params) {
  if (!API_URL) return null;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
  try {
    const q = new URLSearchParams(params).toString();
    const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + q + '&_=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
    return await res.json();
  } catch (e) { return null; } finally { clearTimeout(to); }
}

const readPhoto = (f, max = 640, q = .7) => new Promise(res => {
  const fr = new FileReader();
  fr.onerror = () => res(null);
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => res(null);
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
});

    if (m === 'nube') { $('pdt').textContent = 'Sin conexión'; info('Necesita la conexión con la hoja de Google para iniciar sesión.'); return; }

        ${crear ? '<input class="sinp" id="lpw2" type="password" maxlength="40" placeholder="Repite la contraseña" autocomplete="new-password">' : ''}

        <button class="btn wide" id="lgo">${crear ? 'Crear perfil' : 'Iniciar sesión'}</button>
        <button class="btn glass" id="ltg" style="width:100%">${crear ? 'Ya tengo perfil · Iniciar sesión' : 'No tengo perfil · Crear uno'}</button>
      </div>`;
    $('ltg').onclick = () => { elegido = crear ? 'login' : 'crear'; modo = ''; loginPaint(); };
    const err = t => { if ($('lerr')) $('lerr').textContent = t; };
    const go1 = async () => {

      const btn = $('lgo'); btn.disabled = true; btn.style.opacity = .6; err('');

      if (!r) err('Sin conexión. Intenta de nuevo.');

      else if (r.error === 'pw') err(`Nombre o contraseña incorrectos.${r.quedan > 0 ? ` Te quedan ${r.quedan} intentos.` : ''}`);

/* Pantalla del dueño: advertencia → QR. Al escanearlo, el cupón queda canjeado (una sola vez). */
function cupQR(x) {
  const t = TIERS[x.n] || TIERS.bronce, ov = document.createElement('div'); ov.className = 'qov'; document.body.appendChild(ov);
  let timer = 0, alive = true;
  const close = () => { alive = false; clearInterval(timer); ov.remove(); loadCupones(); };
  const box = html => { ov.innerHTML = `<div class="qbox">${html}</div>`; };
  const cerrar = '<button class="btn glass" id="qcl" style="width:100%;margin-top:10px">Cerrar</button>';
  const hecho = () => { clearInterval(timer); box(`<div class="qres ya"><div class="qic">⛔</div><h3>Canjeado</h3><div class="qp">${escH(x.c)}</div><small>Este cupón ya se canjeó y no se puede usar otra vez.</small></div>${cerrar}`); $('qcl').onclick = close; };
  ov.onclick = e => { if (e.target === ov) close(); };

  $('qno').onclick = close;

    box('<div class="qic">⏳</div><h3>Generando QR…</h3>');
    const r = await apiGet({ cupon_qr: 1, clave: API_KEY, ...authQ(), fecha: x.f });
    if (!alive) return;
    if (!r || !r.ok) {
      const m = !r ? 'Sin conexión. Inténtalo de nuevo.' : tokenMalo(r) ? 'Tu sesión venció. Vuelve a entrar desde Perfil.' : 'No se pudo generar el QR. Revisa que el script de Google esté actualizado.';
      box(`<div class="qic">😕</div><h3>${m}</h3>${cerrar}`); $('qcl').onclick = close; return;
    }
    if (r.canjeado) { hecho(); return; }
    const url = location.href.split(/[?#]/)[0] + '?cup=' + encodeURIComponent(r.codigo);
    box(`<h3>${escH(x.c)}</h3><div class="qsvg">${qrSvg(url)}</div><div class="qwarn">⚠️ Cuando escaneen este QR, el cupón se dará por canjeado y no se podrá usar de nuevo.</div>${cerrar}`);

  };
}

/* ===================== Pendientes ===================== */

    else if (o.k === 'done') { const x = m.get(o.id); if (x) x.d = o.d; }

}
const todoLabel = () => { const l = todos(), n = l.filter(x => !x.d).length; return !l.length ? 'Sin tareas' : n ? `${n} por hacer` : 'Todo al día ✓'; };

// notitas desde el celular (con un atajo o la app de Sheets) sin tocar este archivo. Vacío ("") = se usan CARTA y NOTITAS de arriba.
// La hoja tiene dos columnas: A = campo, B = valor. Campos: sobre, saludo, carta, firma, nota1 … nota6.
// En "carta" cada salto de línea dentro de la celda es un párrafo nuevo.
const BUZON_SHEET_URL = "";

function buzonFromRows(rows) {
  const out = {}, nn = {};
  rows.forEach(r => {
    const k = String(r[0] || '').trim().toLowerCase().replace(/\s+/g, ''), v = String(r[1] || '').trim();
    if (!k || !v) return;
    let m;
    if (k === 'sobre' || k === 'saludo' || k === 'firma') out[k] = v;
    else if (k === 'carta') out.texto = v.split(/\n+/).map(x => x.trim()).filter(Boolean);
    else if ((m = /^nota(\d)$/.exec(k))) nn[+m[1]] = v;
  });
  out.notas = Object.keys(nn).sort((a, b) => a - b).map(k => nn[k]).slice(0, 6);
  return out;
}
function getBuzon() {
  const b = (hasSheet(BUZON_SHEET_URL) && store.get('qn_buzon', null)) || {};
  return {
    sobre: b.sobre || CARTA.sobre, saludo: b.saludo || CARTA.saludo, firma: b.firma || CARTA.firma,
    texto: b.texto && b.texto.length ? b.texto : CARTA.texto,
    notas: b.notas && b.notas.length ? b.notas : NOTITAS,
  };
}
async function loadBuzon() {
  if (!hasSheet(BUZON_SHEET_URL)) return;
  try {
    const rows = await fetchTab('buzon', BUZON_SHEET_URL);
    if (!rows) return;
    const b = buzonFromRows(rows);
    if (!b.sobre && !b.saludo && !b.firma && !b.texto && !b.notas.length) return; // la hoja no es válida: se queda con lo guardado
    if (JSON.stringify(store.get('qn_buzon', null)) === JSON.stringify(b)) return;
    store.set('qn_buzon', b);
    const stg = $('stg');
    if (stg && !stg.classList.contains('opened')) showMailbox(true); // si está en el buzón sin abrir, se refresca

}

const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtTime = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return t || ''; const h = +m[1]; return `${h % 12 || 12}:${m[2]} ${h < 12 ? 'AM' : 'PM'}`; };
const evKey = e => e.date + '|' + String(e.title).trim().toLowerCase();
const isoOf = v => {
  v = String(v || '').trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[3]}-${pad2(m[2])}-${pad2(m[1])}` : '';
};
const dateLabel2 = iso => {
  const [y, m, d] = String(iso).split('-').map(Number); if (!y) return 'Elegir fecha';
  const x = new Date(y, m - 1, d).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', year: y === new Date().getFullYear() ? undefined : 'numeric' }).replace(/\./g, '');
  return x[0].toUpperCase() + x.slice(1);
};
const allEvents = () => {
  const seen = new Set(), out = [], del = new Set(store.get('qn_ev_del', []).map(x => x.k));
  const add = (list, src) => list.forEach(e => {
    if (!e || !e.date || !e.title) return;
    const k = evKey(e); if (seen.has(k) || del.has(k)) return;
    seen.add(k); out.push({ ...e, src });
  });
  add(EVENTS, 'code');
  if (hasSheet(EVENTS_SHEET_URL)) add(store.get('qn_ev_sheet', []), 'sheet');
  add(store.get('qn_ev_local', []), 'local');
  return out.sort((a, b) => (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1);
};

async function loadEventos() {
  if (!hasSheet(EVENTS_SHEET_URL)) return;
  try {
    const rows = await fetchTab('eventos', EVENTS_SHEET_URL);
    if (!rows) return;
    const evs = rows.map(r => ({ date: isoOf(r[0]), time: String(r[1] || '').trim(), title: String(r[2] || '').trim(), note: String(r[3] || '').trim() }))
      .filter(e => e.date && e.title);
    store.set('qn_ev_sheet', evs);
    const keys = new Set(evs.map(evKey)), now = Date.now();
    // borrados pendientes: se quitan cuando ya no están en la hoja (o a los 30 min); si siguen, se reenvían
    const dels = store.get('qn_ev_del', []).filter(x => keys.has(x.k) && now - x.ts < 30 * 60000);
    dels.forEach(x => { if (now - x.ts > 20000) postApi({ tipo: 'evento_borrar', fecha: x.d, titulo: x.t }); });
    store.set('qn_ev_del', dels);
    // añadidos locales: se quitan cuando ya llegaron a la hoja (o al día); si no, se reenvían
    const loc = store.get('qn_ev_local', []).filter(e => !keys.has(evKey(e)) && now - (e.ts || 0) < 864e5);
    loc.forEach(e => { if (now - e.ts > 20000) postApi({ tipo: 'evento', fecha: e.date, hora: e.time || '', titulo: e.title, nota: '' }); });
    store.set('qn_ev_local', loc);
    if ($('evl')) renderEvList();
  } catch (e) { /* sin internet: se queda con lo último guardado */ }
}

function addEvent(title, date, time) {
  store.set('qn_ev_local', [...store.get('qn_ev_local', []), { date, time: time || '', title, note: '', ts: Date.now() }]);
  postApi({ tipo: 'evento', fecha: date, hora: time || '', titulo: title, nota: '' });
}
function deleteEvent(e) {
  const k = evKey(e);
  store.set('qn_ev_local', store.get('qn_ev_local', []).filter(x => evKey(x) !== k));
  store.set('qn_ev_del', [...store.get('qn_ev_del', []).filter(x => x.k !== k), { k, d: e.date, t: e.title, ts: Date.now() }]);
  postApi({ tipo: 'evento_borrar', fecha: e.date, titulo: e.title });
}

}

/* Bloquea el movimiento vertical de la página (solo se mueve el carrusel, o el contenido si no cabe) */
document.addEventListener('touchmove', e => {
  if (e.target.closest('.pager')) return;
  for (let el = e.target; el && el !== document.body; el = el.parentElement) {
    if (el.scrollHeight > el.clientHeight + 1) { const o = getComputedStyle(el).overflowY; if (o === 'auto' || o === 'scroll') return; }

}, { passive: false });

function playCorazones(area, ui, done) {
  let score = 0, t = 30, spawnT = 0, tickT = 0;
  area.innerHTML = ''; ui.score(0); ui.time(t);
  const spawn = () => {
    const r = Math.random(), kind = r < .68 ? 'h' : r < .85 ? 'g' : 'b', el = document.createElement('button');
    el.className = 'gh'; el.textContent = kind === 'h' ? '❤️' : kind === 'g' ? '💛' : '💔';
    el.style.left = (Math.random() * 80 + 2) + '%'; el.style.top = (Math.random() * 76 + 2) + '%';
    const life = setTimeout(() => el.remove(), 1100);
    el.onpointerdown = ev => { ev.preventDefault(); el.onpointerdown = null; clearTimeout(life); score = Math.max(0, score + (kind === 'h' ? 1 : kind === 'g' ? 3 : -2)); ui.score(score); el.classList.add('pop'); setTimeout(() => el.remove(), 160); };
    area.appendChild(el);
  };
  spawnT = setInterval(spawn, 600);
  tickT = setInterval(() => { t--; ui.time(t); if (t <= 0) { clearInterval(spawnT); clearInterval(tickT); area.innerHTML = ''; done(score); } }, 1000);
  return () => { clearInterval(spawnT); clearInterval(tickT); };
}
function playMemoria(area, ui, done) {
  const emo = ['💗', '🌸', '🍓', '🦋', '🌙', '⭐', '🍫', '🎀'], deck = shuffle([...emo, ...emo]);
  let first = -1, lock = false, moves = 0, found = 0, secs = 0, timer = 0, off = 0;
  area.innerHTML = `<div class="mgrid">${deck.map((_, i) => `<button class="mc" data-i="${i}">❔</button>`).join('')}</div>`;
  ui.score(0); ui.time(0);
  const cards = [...area.querySelectorAll('.mc')];
  area.firstChild.onclick = e => {
    const b = e.target.closest('.mc'); if (!b || lock || b.classList.contains('up') || b.classList.contains('ok')) return;
    if (!timer) timer = setInterval(() => { secs++; ui.time(secs); }, 1000);
    const i = +b.dataset.i; b.textContent = deck[i]; b.classList.add('up');
    if (first < 0) { first = i; return; }
    moves++; ui.score(moves);
    const a = first; first = -1;
    if (deck[a] === deck[i]) {
      [a, i].forEach(k => { cards[k].classList.remove('up'); cards[k].classList.add('ok'); });
      if (++found === 8) { clearInterval(timer); done(Math.max(0, 1000 - Math.max(0, moves - 8) * 25 - secs * 5)); }
    } else {
      lock = true;
      off = setTimeout(() => { [a, i].forEach(k => { cards[k].classList.remove('up'); cards[k].textContent = '❔'; }); lock = false; }, 750);
    }
  };
  return () => { clearInterval(timer); clearTimeout(off); };
}
function playTap(area, ui, done) {
  let n = 0, t = 10, timer = 0;
  area.innerHTML = '<button class="tapbtn">TOCA<br>AQUÍ</button>';
  ui.score(0); ui.time(t);
  const b = area.firstChild;
  b.onpointerdown = ev => {
    ev.preventDefault();
    if (!timer) timer = setInterval(() => { t--; ui.time(t); if (t <= 0) { clearInterval(timer); b.onpointerdown = null; b.disabled = true; done(n); } }, 1000);
    n++; ui.score(n);
  };
  return () => clearInterval(timer);
}

  const place = () => cups.forEach((c, i) => { c.style.setProperty('--x', X[slot[i]] + '%'); c.nextElementSibling.style.setProperty('--x', X[slot[i]] + '%'); });
  const stats = () => { $('mst2').textContent = won + lost ? `${won} ganada${won === 1 ? '' : 's'} · ${lost} perdida${lost === 1 ? '' : 's'}` : 'Sin apuestas aún'; };
  const reset = () => { cups.forEach(c => c.classList.remove('up', 'pick', 'chosen', 'hop')); stone.classList.remove('show'); };
  setBet(Math.min(100, miSaldo()));
  amt.oninput = () => { const n = bet(); amt.value = n ? fmt(n) : ''; };
  $('mbet').onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, cur = bet(), sal = miSaldo();
    setBet(a === 'half' ? Math.max(1, Math.floor(cur / 2)) : a === 'dbl' ? cur * 2 : a === 'all' ? sal : cur + (+a));
  };
  async function shuffle() {
    for (let k = 0; k < 9 && alive; k++) {
      const a = Math.floor(Math.random() * 3); let b = Math.floor(Math.random() * 3); if (b === a) b = (a + 1) % 3;
      const ca = slot.indexOf(a), cb = slot.indexOf(b);
      slot[ca] = b; slot[cb] = a; cups[ca].classList.add('hop'); place();
      await sleep(330); cups[ca].classList.remove('hop'); await sleep(40);
    }
  }
  async function empezar() {
    const n = bet(), sal = miSaldo();
    if (n < 1) { say('Escribe cuánto quieres apostar.'); return; }
    if (n > sal) { say(sal < 1 ? 'No tienes LoveCoins para apostar. ¡Gana más en Juegos!' : 'No te alcanzan las LoveCoins para esa apuesta.', 'lose'); return; }
    state = 'shuffle'; lock(true); reset(); say('Mezclando las tapitas…');
    await sleep(350); await shuffle(); if (!alive) return;
    state = 'pick'; cups.forEach(c => c.classList.add('pick')); say('¿Dónde está la piedrita? Toca una tapita 👆');
  }
  async function elegir(c) {
    if (state !== 'pick') return;
    state = 'busy'; const n = bet(), eleccion = slot[c];
    cups.forEach(x => x.classList.remove('pick')); cups[c].classList.add('chosen'); say('Revelando…');
    const r = await apiGet({ apostar: 1, clave: API_KEY, ...authQ(), apuesta: n, eleccion });
    if (!alive) return;
    if (!r || !r.ok) {
      reset(); state = 'idle'; lock(false);
      if (tokenMalo(r)) { say('Tu sesión venció. Vuelve a entrar desde Perfil.', 'lose'); return; }
      say(!r ? 'Sin conexión: no se hizo la apuesta, no perdiste nada.' : r.error === 'saldo' ? 'No te alcanzan las LoveCoins para esa apuesta.' : 'No se pudo apostar. Revisa que el script esté actualizado.', 'lose');
      if (r && r.error === 'saldo') loadMonedas();
      return;
    }
    store.set('qn_monedas', { ...saldos(), [yo()]: r.saldo }); updLC();
    const pc = slot.indexOf(r.piedra);                       // copa que esconde la piedrita
    stone.style.left = (X[r.piedra] + 15) + '%';
    if (r.gano) {
      cups[c].classList.remove('chosen'); cups[c].classList.add('up'); stone.classList.add('show');
      won++; say(`¡Acertaste! 🎉 Te entregan ${fmt(r.pago)} LoveCoins (apostaste ${fmt(r.apuesta)}).`, 'win');
      confetti(r.apuesta >= 1000 ? 44 : 26);
    } else {
      cups[c].classList.remove('chosen'); cups[c].classList.add('up'); await sleep(650); if (!alive) return;
      cups[pc].classList.add('up'); stone.classList.add('show');
      lost++; say(`La piedrita estaba en otra tapita 😕 Perdiste ${fmt(r.apuesta)} LoveCoins.`, 'lose');
    }
    stats(); state = 'idle'; lock(false); go2.textContent = 'Apostar otra vez';
    if (miSaldo() < 1) { say('Te quedaste sin LoveCoins. ¡Gana más en Juegos y vuelve! 💗', 'lose'); go2.disabled = true; }
    else if (bet() > miSaldo()) setBet(miSaldo());
  }
  go2.onclick = () => { if (state === 'idle') empezar(); };
  screen.querySelector('.mstage').onclick = e => { const c = e.target.closest('.mcup'); if (c) elegir(+c.dataset.c); };
  gStop = () => { alive = false; };                           // al salir de la pantalla se frenan las animaciones
  loadMonedas().then(() => { if (!$('mamt')) return; if (state === 'idle') { if (bet() > miSaldo() || !bet()) setBet(Math.min(100, miSaldo())); } });
}

/* ---------- Canjear: LoveCoins por dinero real (de $1.000 a $100.000 COP) · UNO por mes, con QR ---------- */
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaLarga = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]} de ${MESES[+m[2] - 1]}` : 'el próximo mes'; };

/* Pantalla del dueño: advertencia → QR. Al escanearlo, el canje queda entregado (una sola vez). */
function canjeQR(c) {
  const ov = document.createElement('div'); ov.className = 'qov'; document.body.appendChild(ov);
  let timer = 0, alive = true;
  const close = () => { alive = false; clearInterval(timer); ov.remove(); if ($('cjb') && typeof cjRefresh === 'function') cjRefresh(); };
  const box = html => { ov.innerHTML = `<div class="qbox">${html}</div>`; };
  const cerrar = '<button class="btn glass" id="qcl" style="width:100%;margin-top:10px">Cerrar</button>';
  const hecho = () => { clearInterval(timer); box(`<div class="qres ok"><div class="qic">✅</div><h3>Canje entregado</h3><div class="qp">${escH(c.detalle)}</div><small>Este canje ya se entregó y no se puede usar otra vez.</small></div>${cerrar}`); $('qcl').onclick = close; };
  ov.onclick = e => { if (e.target === ov) close(); };
  box(`<div class="qic">💵</div><h3>${escH(c.detalle)}</h3><div class="qwarn">⚠️ Al escanear el QR, el canje se dará por <b>entregado</b>. Solo funciona <b>una vez</b>: si lo escanean de nuevo saldrá «Ya entregado».</div><button class="btn wide" id="qgo">Mostrar QR</button><button class="btn glass" id="qno" style="width:100%;margin-top:8px">Cancelar</button>`);
  $('qno').onclick = close;
  $('qgo').onclick = async () => {
    box('<div class="qic">⏳</div><h3>Generando QR…</h3>');
    const r = await apiGet({ canje_mio: 1, clave: API_KEY, ...authQ() });
    if (!alive) return;
    if (!r || !r.ok) {
      const m = !r ? 'Sin conexión. Inténtalo de nuevo.' : tokenMalo(r) ? 'Tu sesión venció. Vuelve a entrar desde Perfil.' : 'No se pudo generar el QR. Revisa que el script de Google esté actualizado.';
      box(`<div class="qic">😕</div><h3>${m}</h3>${cerrar}`); $('qcl').onclick = close; return;
    }
    if (!r.hay) { box(`<div class="qic">😕</div><h3>No encontré tu canje de este mes.</h3>${cerrar}`); $('qcl').onclick = close; return; }
    if (r.entregado) { hecho(); return; }
    const url = location.href.split(/[?#]/)[0] + '?canje=' + encodeURIComponent(r.secreto);
    box(`<h3>${escH(r.detalle)}</h3><small style="margin-bottom:6px">Código ${escH(r.codigo)}</small><div class="qsvg">${qrSvg(url)}</div><div class="qwarn">⚠️ Cuando escaneen este QR, el canje se dará por entregado y no se podrá usar de nuevo.</div>${cerrar}`);
    $('qcl').onclick = close;
    timer = setInterval(async () => { const q = await apiGet({ canje_estado: 1, clave: API_KEY, codigo: r.secreto }); if (alive && q && q.ok && q.entregado) hecho(); }, 3000);
  };
}

/* Pantalla de quien escanea (abre la página con ?canje=CÓDIGO): marca entregado; si ya estaba, dice «Ya entregado». */
async function showCanjeScan(codigo) {

    box('<div class="qic">⏳</div><h3>Revisando canje…</h3>');
    const r = await apiGet({ canje_escanear: 1, clave: API_KEY, codigo });
    if (!r) { box('<div class="qic">📡</div><h3>Sin conexión</h3><small>No se pudo revisar el canje. Todavía no se entregó: vuelve a intentarlo.</small><button class="btn wide" id="qre" style="margin-top:14px">Reintentar</button>'); $('qre').onclick = run; return; }
    if (!r.ok) box(`<div class="qic">❓</div><h3>QR no válido</h3><small>No encontré este canje.</small>${fin}`);
    else if (r.estado === 'ya') box(`<div class="qres ya"><div class="qic">⛔</div><h3>Ya entregado</h3><div class="qp">${escH(r.detalle)}</div><small>Este canje ya se entregó${r.cuando ? ' el ' + cuando(r.cuando) : ''}.<br>No se puede usar otra vez.</small></div>${fin}`);
    else { box(`<div class="qres ok"><div class="qic">💵</div><h3>¡Canje entregado! ✅</h3><div class="qp">${escH(r.detalle)}</div><small>${r.nombre ? 'Canjeado por ' + escH(r.nombre) + '<br>' : ''}Entregado ${cuando(r.cuando) ? 'el ' + cuando(r.cuando) : 'ahora'}.<br>Si lo escanean de nuevo saldrá «Ya entregado».</small></div>${fin}`); confetti(30); }

  run();
}

/* ===================== Cabecera fija en las páginas internas =====================
   Fecha + título + botón de atrás se quedan arriba (cristal esmerilado) y el contenido pasa por debajo al hacer scroll. */
const appEl = document.querySelector('.app'), mainEl = document.querySelector('main');
new MutationObserver(() => {
  const h = screen.querySelector(':scope > .home');
  const date = h && h.querySelector(':scope > .tdate'), top = h && h.querySelector(':scope > .jtop');
  if (!h || h.querySelector('.stage') || !date || !top) { mainEl.style.marginTop = ''; return; }
  if (h.classList.contains('subp')) return;
  // El cristal de la cabecera sube hasta el borde de la pantalla: se mide cuánto espacio había arriba y se compensa con relleno
  mainEl.style.marginTop = '';
  const up = Math.max(0, Math.round(mainEl.getBoundingClientRect().top - appEl.getBoundingClientRect().top));
  mainEl.style.marginTop = (-10 - up) + 'px';
  const wrap = document.createElement('div'); wrap.className = 'shead'; wrap.style.paddingTop = (up + 10) + 'px';
  h.insertBefore(wrap, date); wrap.append(date, top);
  h.classList.add('subp');
  screen.classList.remove('center'); screen.classList.add('full');
  h.addEventListener('scroll', () => { wrap.classList.toggle('stuck', h.scrollTop > 2); wrap.style.setProperty('--fo', Math.max(0, 1 - h.scrollTop / 60).toFixed(2)); }, { passive: true });
}).observe(screen, { childList: true });

  const setCur = i => { cur = i; if (!press) { tx = xOf(i); kick(); } };
  function open(i) {
    const t = TABS[i];
    if (screen.dataset.tab === t[0]) { const h = screen.querySelector(':scope > .home'); if (h && h.scrollTo) h.scrollTo({ top: 0, behavior: 'smooth' }); setCur(i); return; }
    setCur(i); go(t[2](), { hideTitle: true });
  }
  const px = e => e.clientX - bar.getBoundingClientRect().left;
  base.addEventListener('pointerdown', e => {
    press = true; moved = false; sx = e.clientX; bar.setPointerCapture(e.pointerId); bar.classList.add('press');
    tx = Math.max(pad, Math.min(W - pad - iw, px(e) - iw / 2)); kick(); if (navigator.vibrate) navigator.vibrate(6);
  });
  bar.addEventListener('pointermove', e => {
    if (!press) return;
    if (Math.abs(e.clientX - sx) > 6) moved = true;
    tx = Math.max(pad, Math.min(W - pad - iw, px(e) - iw / 2)); kick();
  });
  const end = e => {
    if (!press) return; press = false; bar.classList.remove('press');
    const i = idxAt(tx + iw / 2); tx = xOf(i); kick();
    if (e.type !== 'pointercancel') open(i); else tx = xOf(cur);
  };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
  base.addEventListener('click', e => { if (e.detail === 0) { const b = e.target.closest('.tb-i'); if (b) open(+b.dataset.i); } });
  bar.addEventListener('contextmenu', e => e.preventDefault());
  new ResizeObserver(measure).observe(bar);
  window.__tabSync = fn => { const i = TABS.findIndex(t => t[2]() === fn); if (i >= 0) { screen.dataset.tab = TABS[i][0]; setCur(i); } else delete screen.dataset.tab; };
  const dot = () => bar.classList.toggle('dot', !!(typeof yo === 'function' && yo() && !cupToday()));
  setInterval(dot, 1500); screen.dataset.tab = 'home'; measure(); dot();

  /* ----- Configuración + modo oscuro ----- */
  const setTheme = d => {
    if (d) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    store.set('qn_theme', d ? 'dark' : 'light');
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = d ? '#150f17' : '#f7f4f5';
  };
  setTheme(document.documentElement.dataset.theme === 'dark');
  window.openCfg = () => {
    const dk = document.documentElement.dataset.theme === 'dark', o = document.createElement('div');
    o.className = 'cfgov';
    o.innerHTML = `<div class="cfg" role="dialog" aria-label="Configuración"><div class="cfgh"><b>Configuración</b><button class="cfgx" aria-label="Cerrar">✕</button></div>
      <div class="cfgrow"><span class="cfgic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 14.6A8.6 8.6 0 0 1 9.4 3.7a.7.7 0 0 0-.9-.9A9.6 9.6 0 1 0 21.2 15.5a.7.7 0 0 0-.9-.9z"/></svg></span><div><b>Modo oscuro</b><small>Cambia la apariencia de toda la app</small></div><button class="sw2${dk ? ' on' : ''}" role="switch" aria-checked="${dk}" aria-label="Modo oscuro"><i></i></button></div></div>`;
    document.body.appendChild(o); void o.offsetWidth; o.classList.add('in');
    const close = () => { o.classList.remove('in'); setTimeout(() => o.remove(), 320); };
    o.onclick = e => { if (e.target === o) close(); };
    o.querySelector('.cfgx').onclick = close;
    const sw = o.querySelector('.sw2');
    sw.onclick = () => { const on = !sw.classList.contains('on'); sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on); setTheme(on); };
  };
})();

/* ===================== Arranque ===================== */
/* Sin rebote arriba: con el contenido en el tope, arrastrar hacia abajo no mueve nada (solo se puede bajar el contenido) */
(() => {
  let yAnt = 0, xAnt = 0, sc = null, horiz = false, y0 = 0, x0 = 0;
  const scroller = el => { for (; el && el !== document.documentElement; el = el.parentElement) { const o = getComputedStyle(el).overflowY; if ((o === 'auto' || o === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el; } return null; };
  window.addEventListener('touchstart', e => { const t = e.touches[0]; y0 = yAnt = t.clientY; x0 = xAnt = t.clientX; horiz = false; sc = scroller(e.target); }, { passive: true, capture: true });
  window.addEventListener('touchmove', e => {
    if (e.touches.length > 1) return;
    const t = e.touches[0];
    if (!horiz && Math.abs(t.clientX - x0) > Math.abs(t.clientY - y0) + 4) horiz = true;   // gesto de lado (carruseles): no se toca
    const baja = t.clientY > yAnt; yAnt = t.clientY; xAnt = t.clientX;
    if (horiz) return;
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (baja && (!sc || sc.scrollTop <= 1)) { if (e.cancelable) e.preventDefault(); }   // el dedo va hacia abajo y ya estás arriba del todo
  }, { passive: false, capture: true });
})();
const fixH = () => { document.documentElement.style.setProperty('--ah', window.innerHeight + 'px'); window.scrollTo(0, 0); };
fixH(); ['resize', 'orientationchange', 'pageshow', 'load'].forEach(ev => window.addEventListener(ev, fixH));

  ['qn_perfiles', 'qn_perfil2', 'qn_perfil_dirty', 'qn_monedas', 'qn_wins', 'qn_yo', 'qn_tok', 'qn_cupones', 'qn_cup_ovr'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  store.set('qn_reset_perfiles1', true);
}
renderHome();

loadBuzon(); loadEventos(); loadPerfiles().then(() => { loadPerfil(); loadMonedas(); }); loadFotos(); loadCupones(); loadTodos(); flushLog();
